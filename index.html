<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCo</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏷️</text></svg>">
    
    <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap">

    <style>
        :root {
            --kolor-glowny: dodgerblue;
            --kolor-tla: black;
            --kolor-bialy: white;
            --kolor-tekstu: black;
            --kolor-skaner: darkorange;
            --kolor-usun: crimson;
            --kolor-zapisz: dodgerblue;
        }
        body { font-family: Lexend; margin: 0; padding: 0.2rem; background-color: var(--kolor-tla); color: var(--kolor-tekstu); }
        .kontener { max-width: 360px; margin: 0 auto; background: var(--kolor-bialy); padding: 0.5rem; border-radius: 24px; box-shadow: 0px 6px 2px gray; }
        h1 { text-align: center; color: var(--kolor-glowny); margin-top: 0; }
        
        .form-grupa { margin-bottom: 0.2rem; }
        .form-grupa label { display: block; margin-bottom: 0.2rem; font-weight: 600; }
        .form-grupa input, .form-grupa select, .form-grupa textarea {
            font-family: Lexend; height: 48px; width: 100%; padding: 0.5rem; box-sizing: border-box; 
            border: 4px solid gray; border-radius: 24px; font-size: 0.9rem;
        }
        
        #warianty { padding: 0.3rem; font-size: 0.8rem; min-height: 48px; resize: none; overflow: hidden; }
        .flex-grupa { display: flex; gap: 0.2rem; align-items: flex-end; }
        .flex-grupa > .form-grupa { flex: 1; }

        .meta-info-kontener { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.2rem; margin: 0 0 1rem 0; font-size: 0.9em; color: var(--kolor-glowny); }
        #gramatura-display-kontener { font-weight: bold; color: var(--kolor-glowny); }

        .cena-sekcja-glowna { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; }
        .kolumna-przycisk-skan { margin-left: 16px; justify-content: center; align-items: center; height: 80px; }
        
        .kolumna-cena-reg #cena { height: 68px; font-size: 2.5rem; text-align: center; font-style: italic; border: 6px solid darkorange; border-radius: 40px; font-weight: 700; color: black; padding: 0; width: 100%; }
        #cena::-webkit-inner-spin-button, #cena::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .cena-jednostkowa-info { text-align: center; font-size: 1rem; color: black; margin-top: 0.2rem; line-height: 1.2; }

        .kolumna-cena-promo { gap: 0.2rem; }
        #cenaPromo, #iloscZestaw { font-style: italic; height: 48px; padding: 0.75rem; box-sizing: border-box; border: 4px solid darkorange; border-radius: 24px; background-color: darkorange; font-weight: 700; color: black; text-align: center; font-size: 1.2rem; }
        #cenaPromo { width: 100%; }
        #iloscZestaw { width: 80px; }
        #cenaPromo::-webkit-inner-spin-button, #cenaPromo::-webkit-outer-spin-button, #iloscZestaw::-webkit-inner-spin-button, #iloscZestaw::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        input::placeholder{ color: dimgray; font-style: italic; font-weight: thin; }
        #cenaPromo::placeholder, #iloscZestaw::placeholder{ color: dimgray; font-style: italic; font-weight: normal; }
        
        #przycisk-skanuj-zapisz { width: 80px; height: 80px; border-radius: 40px; border: none; background-color: var(--kolor-skaner); color: white; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, transform 0.1s; cursor: pointer; flex-shrink: 0; }
        #przycisk-skanuj-zapisz:active { background-color: tomato; box-shadow: 0px 4px dimgray inset; }
        
        .ean-grupa { display: flex; gap: 0.2rem; align-items: flex-end; }
        .ean-grupa > .form-grupa { flex-grow: 1; }

        hr { border: 0; height: 1px; background: gray; }

        .sekcja-io { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.2rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        .przycisk { font: Lexend; height: 48px; width: 100%; border: none; border-radius: 24px; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; display: flex; align-items: center; justify-content: center; }
        .przycisk i { margin-right: 0; font-size: 1.1rem; }

        .przycisk-io { background-color: gainsboro; color: var(--kolor-tekstu); }
        .przycisk-io:active { background-color: gray; box-shadow: 0px 4px dimgray inset; }
        
        .przycisk-zapisz { background-color: var(--kolor-zapisz); color: white; }
        .przycisk-zapisz:active { background-color: royalblue; box-shadow: 0px 4px dimgray inset; }

        .przycisk-usun { background-color: var(--kolor-usun); color: white; }
        .przycisk-usun:active { background-color: darkred; box-shadow: 0px 4px dimgray inset;}

        #lista-produktow { margin-top: 1.5rem; border-top: 1px solid gray; padding-top: 1rem; }
        .produkt-karta { padding: 1rem; background: white; border: 2px solid gray; border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; }
        .produkt-karta:active { background-color: gainsboro; box-shadow: 0px 4px royalblue inset; }
        
        .produkt-karta-naglowek { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .produkt-nazwa { color: dodgerblue; font-weight: bold; flex-grow: 1; margin-right: 8px; }
        .cena-reg-kontener { border: 3px solid darkorange; color: black; padding: 2px 5px; font-weight: bold; border-radius: 3px; margin-left: 8px; font-size: 1.1em; flex-shrink: 0; text-align: right; }
        .cena-promo-kontener { background-color: darkorange; color: black; padding: 2px 5px; border-radius: 3px; margin-left: 8px; font-size: 1em; flex-shrink: 0; }
        .produkt-detale { font-size: 0.9em; color: black; display: flex; margin-bottom: 2px; justify-content: space-between; }
        .produkt-metadata { font-size: 0.8em; color: slategray; display: flex; justify-content: space-between; }
        
        #skaner-kontener { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); display: none; flex-direction: column; justify-content: flex-start; align-items: center; z-index: 1000; padding: 10px; box-sizing: border-box; }
        #skaner-kontener.aktywny { display: flex; }

        #przycisk-zamknij-skaner { position: absolute; top: 10px; right: 10px; background: var(--kolor-usun); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; z-index: 1001; }

        #interactive.viewport { width: 95%; max-width: 550px; height: 70vh; position: relative; border: 3px solid var(--kolor-skaner); margin-top: 50px; }
        #interactive.viewport canvas, #interactive.viewport video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #wynik-skanowania { color: white; font-size: 1.2rem; padding: 10px; background-color: rgba(0, 0, 0, 0.5); border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <main class="kontener">
        <form id="formularz-produktu" onsubmit="return false;">

            <div class="ean-grupa">
                <div class="form-grupa" style="margin-bottom: 0;">
                    <input type="text" inputmode="numeric" pattern="[0-9]*" id="ean" name="ean" placeholder="Wpisz lub zeskanuj kod EAN..." style="border: 4px solid black;" required>
                </div>
            </div>
            
            <div class="flex-grupa">
                <div class="form-grupa">
                    <label for="marka"></label>
                    <input type="text" id="marka" name="marka" placeholder="MARKA">
                </div>
                <div class="form-grupa">
                    <label for="sklep"></label>
                    <select id="sklep" name="sklep">
                        <option value="BIED">BIED</option>
                        <option value="LIDL">LIDL</option>
                        <option value="DINO">DINO</option>
                        <option value="KAUF">KAUF</option>
                        <option value="AUCH">AUCH</option>
                        <option value="ELEC">ELEC</option>
                        <option value="ACTI">ACTI</option>
                        <option value="ROSS">ROSS</option>
                        <option value="PEPC">PEPC</option>
                        <option value="INNE">INNE</option>
                    </select>
                </div>
            </div>
            
            <div class="form-grupa" style="margin-bottom: 0.5rem;">
                <label for="nazwa"></label>
                <input type="text" id="nazwa" name="nazwa" placeholder="Nazwa 1szt." style="color: dodgerblue; font-weight: bold; border: 4px solid dodgerblue;">
            </div>
            
            <div class="meta-info-kontener">
                <div id="gramatura-display-kontener">
                    <strong id="gramaturaText"></strong> /
                    <class="cena-jednostkowa-info" id="cenaJednostkowaDisplay"></class>
                </div>
                <div id="data-aktualizacji-kontener">
                    <strong id="dataAktualizacjiDisplay">Brak</strong>
                </div>
            </div>
            
            <input type="hidden" id="gramatura" name="gramatura" value="1">
            <input type="hidden" id="rodzajGramatury" name="rodzajGramatury" value="szt">
            <input type="hidden" id="dataAktualizacji" name="dataAktualizacji">

            <div class="cena-sekcja-glowna">
                <div class="kolumna-cena-reg">
                    <input type="number" id="cena" name="cena" placeholder="0.00" step="0.01">
                </div>
                <div class="kolumna-przycisk-skan">
                    <button type="button" id="przycisk-skanuj-zapisz" title="Zapisz zmiany i zeskanuj nowy EAN">
                        <i class="fas fa-barcode"></i>
                    </button>
                </div>
            </div>
            
            <div class="flex-grupa">
                <div>
                    <input type="number" id="cenaPromo" name="cenaPromo" placeholder="0,00" step="0.01">
                </div>przy <br> zak.
                <div>
                    <input type="number" id="iloscZestaw" name="iloscZestaw" placeholder="1 szt." value="1">
                </div>
            </div>
            
            <div class="flex-grupa">
                <div class="form-grupa">
                    <label for="producent"></label>
                    <input type="text" id="producent" name="producent" placeholder="Producent">
                </div>
                <div class="form-grupa">
                    <label for="pogrupowanie"></label>
                    <select id="pogrupowanie" name="pogrupowanie">
                        <option value="SŁONY">SŁONY</option>
                        <option value="SŁODKI">SŁODKI</option>
                        <option value="NAPOJE">NAPOJE</option>
                        <option value="DPH">DPH</option>
                        <option value="GOSPO">GOSPO.</option>
                        <option value="Worki na śmieci">Worki na śmieci</option>
                        <option value="MAJSTER">MAJSTER.</option>
                        <option value="SEZON">SEZON</option>
                        <option value="ŚWIEŻY">ŚWIEŻY</option>
                        <option value="Jogurty">Jogurty</option>
                        <option value="Sery">Sery</option>
                    </select>
                </div>
            </div>

            <div class="form-grupa">
                <label for="warianty">Warianty (np. smaki, kolory)</label>
                <textarea id="warianty" name="warianty" placeholder="np. Czekoladowy, Waniliowy, Czerwony"
                          oninput="this.style.height='auto'; this.style.height=this.scrollHeight + 'px';"></textarea>
            </div>
            
            <textarea id="opis" name="opis" style="display:none;"></textarea>

            <div id="komunikat"></div>

        </form>

        <div class="sekcja-io">
            <button type="button" id="przycisk-dodaj" class="przycisk przycisk-zapisz" title="Dodaj lub nadpisz produkt (EAN + Sklep)">
                <i class="fas fa-plus"></i> 
            </button>
            <button type="button" id="przycisk-zapisz" class="przycisk przycisk-zapisz" title="Zapisz dane wspólne (Nazwa, Marka itp.) dla WSZYSTKICH produktów z tym EAN">
                <i class="fas fa-save"></i> 
            </button>
            <button type="button" id="przycisk-eksport" class="przycisk przycisk-io" title="Eksportuj całą bazę do pliku CSV">
                <i class="fas fa-file-export"></i>
            </button>
            <input type="file" id="input-import" accept=".csv" style="display: none;">
            <button type="button" id="przycisk-import" class="przycisk przycisk-io" title="Importuj bazę z pliku CSV (nadpisz lub połącz)">
                <i class="fas fa-file-import"></i>
            </button>
            <button type="button" id="przycisk-usun" class="przycisk przycisk-usun" title="Usuń obecny produkt z bazy (EAN + Sklep)">
                <i class="fas fa-xmark"></i> 
            </button>
          </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem;">
            <button type="button" id="przycisk-filtr" class="przycisk przycisk-zapisz" style="width: 48px;" title="Filtruj listę: Wszystko">
                <i class="fas fa-filter"></i> 
            </button>
            <h2>Zapisane produkty</h2> 
      			<button type="button" id="przycisk-wyczysc-baze" class="przycisk przycisk-usun" style="width: 48px;" title="Usuń CAŁĄ bazę produktów (czyszczenie localStorage)">
      			    <i class="fas fa-trash-alt"></i>
      			</button>
        </div>
        
        <div id="lista-produktow">
        </div>

    </main>

    <div id="skaner-kontener">
        <button id="przycisk-zamknij-skaner">X Zamknij</button>
        <div id="interactive" class="viewport"></div>
        <div id="wynik-skanowania">Gotowy do skanowania...</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const formularz = document.getElementById('formularz-produktu');
            const eanInput = document.getElementById('ean');
            const listaProduktowDiv = document.getElementById('lista-produktow');
            const komunikatDiv = document.getElementById('komunikat');
            
            const btnDodaj = document.getElementById('przycisk-dodaj'); 
            const btnZapiszWspolne = document.getElementById('przycisk-zapisz'); 
            const btnUsun = document.getElementById('przycisk-usun'); 
            const btnEksport = document.getElementById('przycisk-eksport');
            const btnImport = document.getElementById('przycisk-import');
            const inputImport = document.getElementById('input-import');
            const btnWyczyscBaze = document.getElementById('przycisk-wyczysc-baze'); 
            const btnFiltr = document.getElementById('przycisk-filtr'); 

            const btnSkanujZapisz = document.getElementById('przycisk-skanuj-zapisz'); 
            const skanerKontener = document.getElementById('skaner-kontener');
            const btnZamknijSkaner = document.getElementById('przycisk-zamknij-skaner');
            const wynikSkanowaniaDiv = document.getElementById('wynik-skanowania');
            
            const nazwaInput = document.getElementById('nazwa');
            const dataAktualizacjiDisplay = document.getElementById('dataAktualizacjiDisplay'); 
            const dataAktualizacjiInput = document.getElementById('dataAktualizacji'); 
            
            const cenaInput = document.getElementById('cena');
            const cenaPromoInput = document.getElementById('cenaPromo');
            const iloscZestawInput = document.getElementById('iloscZestaw'); 

            const gramaturaInput = document.getElementById('gramatura');
            const rodzajGramaturyInput = document.getElementById('rodzajGramatury');
            const gramaturaText = document.getElementById('gramaturaText');
            const cenaJednostkowaDisplay = document.getElementById('cenaJednostkowaDisplay');

            let ostatnioZeskanowanyEAN = null;
            let licznikPoprawnychOdczytow = 0;
            const WYMAGANY_COUNT = 3; 
            
            let stanFiltru = 'wszystko'; // 'wszystko', 'ean', 'nazwa', 'grupa'

            let bazaProduktow = [];
            const KLUCZ_BAZY = 'mojaBazaProduktowEAN';
            
            let ostatniUzytySklep = 'BIED'; 
            let ostatnieUzytePogrupowanie = '';
            
            // Usunięto 'powiazane'
            const KOLUMNY_CSV = [
                'ean', 'nazwa', 'sklep', 'marka', 'producent', 'pogrupowanie', 
                'gramatura', 'rodzajGramatury', 'cena', 'cenaPromo', 'iloscZestaw', 
                'dataAktualizacji', 'warianty'
            ];

            const parseDate = (dateStr) => {
                if (!dateStr || dateStr.toLowerCase() === 'brak daty') return new Date(0); 
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    return new Date(parts[0], parts[1] - 1, parts[2]);
                }
                return new Date(0);
            };
            
            const zaladujBaze = () => {
                const daneZLocalStorage = localStorage.getItem(KLUCZ_BAZY);
                if (daneZLocalStorage) {
                    try {
                        bazaProduktow = JSON.parse(daneZLocalStorage);
                    } catch (e) {
                        console.error("Błąd ładowania JSON z localStorage:", e);
                        bazaProduktow = [];
                    }
                } else {
                    bazaProduktow = [];
                }
                wyswietlListe();
            };

            const zapiszBaze = () => {
                localStorage.setItem(KLUCZ_BAZY, JSON.stringify(bazaProduktow));
            };
            
            const pokazKomunikat = (wiadomosc, typ = 'sukces') => {
                komunikatDiv.textContent = wiadomosc;
                komunikatDiv.className = `komunikat ${typ}`;
                
                setTimeout(() => {
                    komunikatDiv.className = '';
                    komunikatDiv.textContent = '';
                }, 4000);
            };

            const wyczyscFormularz = () => {
                formularz.reset();
                dataAktualizacjiDisplay.textContent = 'Brak';
                dataAktualizacjiInput.value = '';
                iloscZestawInput.value = 1; 
                document.getElementById('sklep').value = ostatniUzytySklep;
                
                gramaturaText.textContent = "--";
                gramaturaInput.value = 1;
                rodzajGramaturyInput.value = 'szt';
                cenaJednostkowaDisplay.textContent = "--";
            };
            
            const wypelnijFormularz = (produkt) => {
                if (!produkt) return;
                for (const klucz in produkt) {
                    const pole = formularz.elements[klucz];
                    if (pole && typeof produkt[klucz] !== 'undefined') { 
                        pole.value = produkt[klucz];
                    }
                }
                document.getElementById('warianty').value = produkt.warianty || '';
                iloscZestawInput.value = produkt.iloscZestaw || 1; 

                if (!produkt.sklep) {
                    document.getElementById('sklep').value = ostatniUzytySklep;
                }

                const data = produkt.dataAktualizacji || 'Brak';
                dataAktualizacjiDisplay.textContent = data;
                dataAktualizacjiInput.value = data !== 'Brak' ? data : '';
                
                const gram = produkt.gramatura || 1;
                const rodzaj = produkt.rodzajGramatury || 'szt';
                gramaturaInput.value = gram;
                rodzajGramaturyInput.value = rodzaj;
                
                zaktualizujWidokGramatury(gram, rodzaj);
                obliczCeneJednostkowa();

                wyswietlListe();
            };

            const zaktualizujWidokGramatury = (gram, rodzaj) => {
                if (gram && rodzaj) {
                    gramaturaText.textContent = `${gram} ${rodzaj}`;
                } else {
                    gramaturaText.textContent = "Brak danych";
                }
            };

            const pobierzDaneZFormularza = () => {
                const formData = new FormData(formularz);
                const produkt = {};
                for (const [klucz, wartosc] of formData.entries()) {
                    produkt[klucz] = wartosc;
                }
                return produkt;
            };

            const wyszukajLubWyczysc = () => {
                const ean = eanInput.value.trim();
                const wybranySklep = document.getElementById('sklep').value;
                const wpisanaNazwa = nazwaInput.value.trim().toUpperCase();
                
                if (!ean) {
                    wyczyscFormularz();
                    nazwaInput.focus();
                    wyswietlListe(); 
                    return;
                }
                
                // Szukamy wg nowego priorytetu: EAN+Sklep -> EAN -> Nazwa+Sklep -> Nazwa
                let znalezionyProdukt = bazaProduktow.find(p => p.ean === ean && p.sklep === wybranySklep);
                
                if (!znalezionyProdukt) znalezionyProdukt = bazaProduktow.find(p => p.ean === ean);
                
                if (!znalezionyProdukt && wpisanaNazwa) {
                     znalezionyProdukt = bazaProduktow.find(p => (p.nazwa || '').toUpperCase() === wpisanaNazwa && p.sklep === wybranySklep);
                     if (!znalezionyProdukt) znalezionyProdukt = bazaProduktow.find(p => (p.nazwa || '').toUpperCase() === wpisanaNazwa);
                }
                
                if (znalezionyProdukt) {
                    wypelnijFormularz(znalezionyProdukt);
                    if (znalezionyProdukt.sklep !== wybranySklep) {
                         pokazKomunikat(`Załadowano produkt ze sklepu: ${znalezionyProdukt.sklep}`, 'info');
                    } else {
                         pokazKomunikat(`Załadowano produkt: ${znalezionyProdukt.nazwa}`);
                    }
                    nazwaInput.focus(); 
                } else {
                    const wpisanyEAN = eanInput.value;
                    wyczyscFormularz();
                    eanInput.value = wpisanyEAN; 
                    document.getElementById('sklep').value = ostatniUzytySklep;
                    document.getElementById('pogrupowanie').value = ostatnieUzytePogrupowanie;
                    
                    autoUzupelnijGramature();
                    pokazKomunikat('Nowy produkt. Wypełnij dane.', 'info');
                    nazwaInput.focus();
                }
            };

            const dodajProdukt = () => {
                const daneProduktu = pobierzDaneZFormularza();
                const ean = daneProduktu.ean.trim();
                
                if (!ean) {
                    pokazKomunikat('EAN jest wymagany!', 'blad');
                    eanInput.focus();
                    return false;
                }

                const indeksProduktu = bazaProduktow.findIndex(p => p.ean === ean && p.sklep === daneProduktu.sklep);
                const dzisiejszaData = new Date().toISOString().split('T')[0];

                if (indeksProduktu > -1) {
                    const staryProdukt = bazaProduktow[indeksProduktu];
                    
                    if (String(staryProdukt.cena) !== String(daneProduktu.cena) || 
                        String(staryProdukt.cenaPromo) !== String(daneProduktu.cenaPromo) ||
                        String(staryProdukt.iloscZestaw) !== String(daneProduktu.iloscZestaw)
                    ) {
                        daneProduktu.dataAktualizacji = dzisiejszaData;
                    } else {
                        daneProduktu.dataAktualizacji = staryProdukt.dataAktualizacji || dzisiejszaData;
                    }
                    
                    bazaProduktow[indeksProduktu] = daneProduktu;
                    pokazKomunikat('Produkt nadpisany!', 'sukces');
                    
                } else {
                    daneProduktu.dataAktualizacji = dzisiejszaData;
                    bazaProduktow.push(daneProduktu);
                    pokazKomunikat('Produkt dodany!', 'sukces');
                }

                ostatniUzytySklep = daneProduktu.sklep;
                ostatnieUzytePogrupowanie = daneProduktu.pogrupowanie;
                
                zapiszBaze();
                wyswietlListe(); 
                
                dataAktualizacjiDisplay.textContent = daneProduktu.dataAktualizacji;
                dataAktualizacjiInput.value = daneProduktu.dataAktualizacji;
                zaktualizujWidokGramatury(daneProduktu.gramatura, daneProduktu.rodzajGramatury);
                obliczCeneJednostkowa();

                return true;
            };

            const zapiszDaneWspolne = () => {
                const ean = eanInput.value.trim();
                if (!ean) return;

                const daneFormularza = pobierzDaneZFormularza();
                let zaktualizowanoLicznik = 0;

                bazaProduktow.forEach(produkt => {
                    if (produkt.ean === ean) {
                        produkt.nazwa = daneFormularza.nazwa;
                        produkt.marka = daneFormularza.marka;
                        produkt.producent = daneFormularza.producent;
                        produkt.pogrupowanie = daneFormularza.pogrupowanie;
                        produkt.warianty = daneFormularza.warianty;
                        zaktualizowanoLicznik++;
                    }
                });

                if (zaktualizowanoLicznik > 0) {
                    zapiszBaze();
                    wyswietlListe();
                    pokazKomunikat(`Zaktualizowano dane wspólne dla ${zaktualizowanoLicznik} produktów.`, 'sukces');
                }
            };

            const zapiszISkanujNowy = () => {
                const ean = eanInput.value.trim();
                if (!ean) {
                    startSkaner('glowny');
                } else {
                    if (dodajProdukt()) startSkaner('glowny');
                }
            };

            const usunProdukt = () => {
                const ean = eanInput.value.trim();
                const sklep = document.getElementById('sklep').value;
                if (!ean) return;
                
                const indeksProduktu = bazaProduktow.findIndex(p => p.ean === ean && p.sklep === sklep);
                
                if (indeksProduktu > -1) {
                    if (window.confirm(`Usunąć ${bazaProduktow[indeksProduktu].nazwa} ze sklepu ${sklep}?`)) { 
                        bazaProduktow.splice(indeksProduktu, 1);
                        zapiszBaze();
                        wyswietlListe();
                        wyczyscFormularz();
                        pokazKomunikat('Produkt usunięty.', 'sukces');
                    }
                }
            };

            const wyczyscCalaBaze = () => {
                if (window.confirm("UWAGA! Usunąć CAŁĄ bazę produktów? Tego działania NIE MOŻNA COFNĄĆ!")) {
                    if (window.confirm("POTWIERDŹ USUNIĘCIE: Naciśnij OK.")) {
                        localStorage.removeItem(KLUCZ_BAZY);
                        bazaProduktow = [];
                        wyczyscFormularz();
                        wyswietlListe();
                        pokazKomunikat('Baza usunięta.', 'blad');
                    }
                }
            };
            
            const obliczCeneJednostkowaDlaKarty = (produkt) => {
                const cena = parseFloat(produkt.cena);
                const waga = parseFloat(produkt.gramatura) || 1;
                const jednostka = produkt.rodzajGramatury || 'szt';

                if (!cena || isNaN(cena) || isNaN(waga) || waga === 0) return "- /-";

                let wynik = 0;
                let jednostkaWynikowa = "";

                if (jednostka === 'g' || jednostka === 'ml') {
                    wynik = (cena / waga) * 100;
                    jednostkaWynikowa = (jednostka === 'g') ? '100g' : '100ml';
                } else if (jednostka === 'kg' || jednostka === 'l' || jednostka === 'm') {
                     wynik = cena / waga;
                     jednostkaWynikowa = jednostka;
                } else if (jednostka === 'szt' && waga > 1) {
                     wynik = cena / waga;
                     jednostkaWynikowa = 'szt';
                } else {
                    return "- /-";
                }

                return `${wynik.toFixed(2)} /${jednostkaWynikowa}`;
            };
            
            const wyswietlListe = () => {
                listaProduktowDiv.innerHTML = '';
                
                const aktualnyEAN = eanInput.value.trim();
                const aktualnaNazwa = nazwaInput.value.trim().toUpperCase();
                const aktualnePogrupowanie = document.getElementById('pogrupowanie').value;

                const ikonaFiltra = btnFiltr.querySelector('i');
                switch (stanFiltru) {
                    case 'ean': btnFiltr.title = 'Filtr: Ten EAN'; ikonaFiltra.className = 'fas fa-barcode'; btnFiltr.style.backgroundColor = 'darkorange'; break;
                    case 'nazwa': btnFiltr.title = 'Filtr: Ta Nazwa'; ikonaFiltra.className = 'fas fa-font'; btnFiltr.style.backgroundColor = 'darkorange'; break;
                    case 'grupa': btnFiltr.title = 'Filtr: Ta Grupa'; ikonaFiltra.className = 'fas fa-layer-group'; btnFiltr.style.backgroundColor = 'darkorange'; break;
                    default: btnFiltr.title = 'Filtr: Wszystko'; ikonaFiltra.className = 'fas fa-filter'; btnFiltr.style.backgroundColor = 'var(--kolor-zapisz)';
                }

                if (bazaProduktow.length === 0) {
                    listaProduktowDiv.innerHTML = '<p style="text-align: center; color: #777;">Brak produktów.</p>';
                    return;
                }
                
                const produktyDoWyswietlenia = bazaProduktow.filter(produkt => {
                    if (stanFiltru === 'wszystko') return true;
                    if (stanFiltru === 'ean' && aktualnyEAN) return produkt.ean === aktualnyEAN;
                    if (stanFiltru === 'nazwa' && aktualnaNazwa) return (produkt.nazwa || '').toUpperCase() === aktualnaNazwa;
                    if (stanFiltru === 'grupa' && aktualnePogrupowanie) return produkt.pogrupowanie === aktualnePogrupowanie;
                    return true; 
                });
                
                if (produktyDoWyswietlenia.length === 0) {
                    listaProduktowDiv.innerHTML = '<p style="text-align: center; color: #777;">Brak wyników.</p>';
                    return;
                }

                const posortowaneProdukty = produktyDoWyswietlenia.slice().sort((a, b) => {
                    const nazwaA = (a.nazwa || '').toUpperCase();
                    const nazwaB = (b.nazwa || '').toUpperCase();
                    const grupaA = a.pogrupowanie || '';
                    const grupaB = b.pogrupowanie || '';

                    const getScore = (produkt) => {
                        let score = 0;
                        if (aktualnyEAN && produkt.ean === aktualnyEAN) score += 100;
                        if (aktualnaNazwa && (produkt.nazwa || '').toUpperCase() === aktualnaNazwa) score += 50;
                        if (aktualnePogrupowanie && produkt.pogrupowanie === aktualnePogrupowanie) score += 10;
                        return score;
                    };
                    
                    const scoreA = getScore(a);
                    const scoreB = getScore(b);

                    if (scoreA !== scoreB) return scoreB - scoreA; 

                    if (grupaA < grupaB) return -1;
                    if (grupaA > grupaB) return 1;
                    if (nazwaA < nazwaB) return -1;
                    if (nazwaA > nazwaB) return 1;
                    
                    return 0;
                });

                posortowaneProdukty.forEach(produkt => {
                    const karta = document.createElement('div');
                    karta.className = 'produkt-karta';
                    
                    // Podświetlanie relacji: ten sam EAN lub ta sama dokładna nazwa
                    const isTenSamEan = aktualnyEAN && produkt.ean === aktualnyEAN;
                    const isTaSamaNazwa = aktualnaNazwa && (produkt.nazwa || '').toUpperCase() === aktualnaNazwa;
                    
                    if (isTenSamEan) {
                         karta.style.border = '4px solid dodgerblue';
                    } else if (isTaSamaNazwa) {
                         karta.style.border = '4px solid darkorange';
                    }

                    const cenaStandardowa = produkt.cena ? parseFloat(produkt.cena).toFixed(2) : '0.00';
                    const dataAktualizacji = produkt.dataAktualizacji || 'Brak daty';
                    const marka = produkt.marka || 'Brak marki';
                    const sklep = produkt.sklep || 'Brak sklepu';
                    
                    const cenaPrzeliczeniowa = obliczCeneJednostkowaDlaKarty(produkt);
                    const pogrupowanieTekst = produkt.pogrupowanie ? `[${produkt.pogrupowanie}]` : '';

                    let cenaPromoHTML = '';
                    if (produkt.cenaPromo && produkt.iloscZestaw) {
                        const cenaZaSzt = parseFloat(produkt.cenaPromo).toFixed(2);
                        const ilosc = parseInt(produkt.iloscZestaw) || 'N';
                        cenaPromoHTML = `<span class="cena-promo-kontener">${cenaZaSzt} / ${ilosc} szt.</span>`;
                    }

                    karta.innerHTML = `
                        <div class="produkt-karta-naglowek">
                            <span class="produkt-nazwa">${produkt.nazwa || 'Brak nazwy'}</span>
                        </div>
                        <div class="produkt-metadata">
                            <span>${dataAktualizacji}</span>
                            <span> ${cenaPrzeliczeniowa} <span class="cena-reg-kontener"> ${cenaStandardowa} zł</span> </span>
                        </div>
                        <div class="produkt-detale">
                            <span>${marka} / ${sklep} </span>
                            <span>${cenaPromoHTML}</span>
                        </div>
                        <div class="produkt-metadata">
                            <span>${pogrupowanieTekst}</span>
                            <span>${produkt.ean}</span>
                        </div>
                    `;
                    
                    karta.addEventListener('click', () => {
                        wypelnijFormularz(produkt);
                        window.scrollTo(0, 0);
                    });
                    
                    listaProduktowDiv.appendChild(karta);
                });
            };

            const eksportujCSV = () => {
                if (bazaProduktow.length === 0) return;
                const naglowki = KOLUMNY_CSV.join(',');
                const wiersze = bazaProduktow.map(produkt => {
                    return KOLUMNY_CSV.map(klucz => {
                        let wartosc = produkt[klucz] || '';
                        if (typeof wartosc === 'string' && (wartosc.includes(',') || wartosc.includes('"') || wartosc.includes('\n'))) {
                            wartosc = `"${wartosc.replace(/"/g, '""')}"`;
                        }
                        return wartosc;
                    }).join(',');
                }).join('\n');

                const finalnyCSV = `${naglowki}\n${wiersze}`;
                const blob = new Blob([finalnyCSV], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.setAttribute('href', url);
                a.setAttribute('download', `produkty_export_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const polaczBaze = (importowaneProdukty) => {
                importowaneProdukty.forEach(importowany => {
                    const istniejacyIndeks = bazaProduktow.findIndex(p => p.ean === importowany.ean && p.sklep === importowany.sklep);
                    if (istniejacyIndeks > -1) {
                        const dataIstniejaca = parseDate(bazaProduktow[istniejacyIndeks].dataAktualizacji);
                        const dataImportowana = parseDate(importowany.dataAktualizacji);
                        if (dataImportowana > dataIstniejaca) bazaProduktow[istniejacyIndeks] = importowany;
                    } else {
                        bazaProduktow.push(importowany);
                    }
                });
            };

            const obsluzImportPliku = (event) => {
                const plik = event.target.files[0];
                if (!plik) return;
                const trybLaczenia = window.confirm('Wybierz tryb importu:\n\nOK: Połącz obecne dane z importowanymi.\nAnuluj: Całkowicie nadpisz obecną bazę.');
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importowaneProdukty = przetworzCSV(e.target.result);
                        if (trybLaczenia) polaczBaze(importowaneProdukty); 
                        else bazaProduktow = importowaneProdukty;
                        
                        zapiszBaze();
                        wyswietlListe();
                        wyczyscFormularz();
                        pokazKomunikat('Import zakończony.', 'sukces');
                    } catch (error) { pokazKomunikat(`Błąd: ${error.message}`, 'blad'); }
                };
                reader.readAsText(plik);
                event.target.value = '';
            };

            const przetworzCSV = (csv) => {
                const linie = csv.split('\n').filter(line => line.trim() !== '');
                if (linie.length === 0) throw new Error('Plik pusty.');
                const nowaBaza = [];
                for (let i = 1; i < linie.length; i++) {
                    const wartosci = linie[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/"/g, ''));
                    const produkt = {};
                    for (let j = 0; j < KOLUMNY_CSV.length; j++) produkt[KOLUMNY_CSV[j]] = wartosci[j] || '';
                    if (produkt.ean && produkt.nazwa) nowaBaza.push(produkt);
                }
                return nowaBaza;
            };

            const startSkaner = () => {
                skanerKontener.classList.add('aktywny');
                wynikSkanowaniaDiv.textContent = 'Ładowanie kamery...';
                ostatnioZeskanowanyEAN = null;
                licznikPoprawnychOdczytow = 0;

                Quagga.init({
                    inputStream: { name: "Live", type: "LiveStream", target: document.querySelector('#interactive'), constraints: { facingMode: "environment", width: { min: 1280 }, height: { min: 720 } }, area: { top: "40%", right: "10%", left: "10%", bottom: "40%" } },
                    locator: { patchSize: "large", halfSample: true, locate: true },
                    decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader", "upc_e_reader"], multiple: false },
                    frequency: 10, numOfWorkers: 0, 
                }, err => {
                    if (err) return;
                    Quagga.start();
                    wynikSkanowaniaDiv.textContent = 'Ustaw kod EAN na środku.';
                });

                Quagga.onDetected(onDetected);
                Quagga.onProcessed(onProcessed);
            };

            const stopSkaner = () => {
                if (Quagga && Quagga.stop) { Quagga.stop(); Quagga.offProcessed(); Quagga.offDetected(); }
                skanerKontener.classList.remove('aktywny');
            };

            const onProcessed = (result) => {
                var drawingCtx = Quagga.canvas.ctx.overlay, drawingCanvas = Quagga.canvas.dom.overlay;
                drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                if (result && result.box) Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "yellow", lineWidth: 2});
            };

            const onDetected = (result) => {
                const ean = result.codeResult.code;
                if (!ean || !(ean.length === 13 || ean.length === 8 || ean.length === 12)) return; 
                
                if (ean === ostatnioZeskanowanyEAN) {
                    licznikPoprawnychOdczytow++;
                    wynikSkanowaniaDiv.textContent = `Wykryto: ${ean} (${licznikPoprawnychOdczytow}/${WYMAGANY_COUNT})`;
                } else {
                    ostatnioZeskanowanyEAN = ean;
                    licznikPoprawnychOdczytow = 1;
                }

                if (licznikPoprawnychOdczytow >= WYMAGANY_COUNT) {
                    stopSkaner(); 
                    eanInput.value = ean; 
                    wyszukajLubWyczysc(); 
                    window.scrollTo(0, 0);
                }
            };
            
            const autoUzupelnijGramature = () => {
                const nazwa = nazwaInput.value;
                const matchGram = nazwa.match(/(\d+[\.,]?\d*)\s*(g|ml|kg|l|m)\.?\s*$/i); 
                const matchSzt = nazwa.match(/(\d+)\s*(szt)\.?\s*$/i);
                
                let znalezionaGramatura = matchGram ? matchGram[1].replace(',', '.') : (matchSzt ? matchSzt[1] : 1);
                let znalezionaJednostka = matchGram ? matchGram[2].toLowerCase() : 'szt';

                gramaturaInput.value = znalezionaGramatura;
                rodzajGramaturyInput.value = znalezionaJednostka;
                zaktualizujWidokGramatury(znalezionaGramatura, znalezionaJednostka);
                obliczCeneJednostkowa();
            };

            const obliczCeneJednostkowa = () => {
                const cena = parseFloat(cenaInput.value);
                const waga = parseFloat(gramaturaInput.value);
                const jednostka = rodzajGramaturyInput.value;

                if (!cena || isNaN(cena) || !waga || isNaN(waga) || !jednostka || waga === 0) {
                    cenaJednostkowaDisplay.textContent = "- /-";
                    return;
                }

                let wynik = 0, jednostkaWynikowa = "";
                if (jednostka === 'g' || jednostka === 'ml') { wynik = (cena / waga) * 100; jednostkaWynikowa = (jednostka === 'g') ? '100g' : '100ml'; }
                else if (jednostka === 'kg' || jednostka === 'l' || jednostka === 'm') { wynik = cena / waga; jednostkaWynikowa = jednostka; }
                else if (jednostka === 'szt' && waga > 1) { wynik = cena / waga; jednostkaWynikowa = 'szt'; }
                else { cenaJednostkowaDisplay.textContent = "- /-"; return; }

                cenaJednostkowaDisplay.textContent = `${wynik.toFixed(2)} /${jednostkaWynikowa}`;
            };

            btnDodaj.addEventListener('click', dodajProdukt); 
            btnZapiszWspolne.addEventListener('click', zapiszDaneWspolne); 
            btnUsun.addEventListener('click', usunProdukt);
            btnEksport.addEventListener('click', eksportujCSV);
            btnImport.addEventListener('click', () => inputImport.click()); 
            inputImport.addEventListener('change', obsluzImportPliku); 
            btnWyczyscBaze.addEventListener('click', wyczyscCalaBaze);
            
            btnFiltr.addEventListener('click', () => {
                if (stanFiltru === 'wszystko') stanFiltru = 'ean';
                else if (stanFiltru === 'ean') stanFiltru = 'nazwa';
                else if (stanFiltru === 'nazwa') stanFiltru = 'grupa';
                else if (stanFiltru === 'grupa') stanFiltru = 'wszystko';
                wyswietlListe(); 
            });

            btnSkanujZapisz.addEventListener('click', zapiszISkanujNowy);
            btnZamknijSkaner.addEventListener('click', stopSkaner);
            nazwaInput.addEventListener('input', autoUzupelnijGramature);
            cenaInput.addEventListener('input', obliczCeneJednostkowa);
            eanInput.addEventListener('blur', wyszukajLubWyczysc);

            const zaznaczPrzyKliknieciu = (event) => event.target.select();
            cenaInput.addEventListener('click', zaznaczPrzyKliknieciu);
            cenaPromoInput.addEventListener('click', zaznaczPrzyKliknieciu);

            zaladujBaze();
            wyczyscFormularz(); 
            eanInput.focus();
        });
    </script>
</body>
</html>
